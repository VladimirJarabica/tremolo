name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a previous run when a new commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & color tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Phase 0 guardrail: no raw oklch()/rgb()/hex or off-theme palettes
      # (zinc/red/blue…) in app code — they don't adapt to dark mode.
      - name: Check for raw color literals
        run: npm run check:colors

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check
